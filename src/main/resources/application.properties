##########################################
## ACTIVE PROFILE
##########################################
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
##########################################
## SERVER
##########################################
server.port=${PORT:8080}
spring.mvc.favicon.enabled=false
##########################################
## CORS CONFIG (React Frontend)
##########################################
app.cors.allowed-origins=http://localhost:3000,https://ogm-backend.onrender.com
##########################################
## SESSION / COOKIES (HTTPS – Render)
##########################################
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
##########################################
## MAIL CONFIG (ENV VARS ONLY)
##########################################
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

##########################################
## FILE STORAGE
##########################################
storage.location=uploads
storage.base-url=${APP_BASE_URL:https://ogm-backend.onrender.com}

##########################################
## JACKSON
##########################################
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

##########################################
## LOGGING (STDOUT ONLY – Render Safe)
##########################################
logging.level.org.springframework.web=INFO
logging.level.com.ogm.market=DEBUG
logging.level.org.hibernate=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF
##########################################
## ACTUATOR
##########################################
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
##########################################
## DATABASE (H2 – works on Render)
##########################################
spring.datasource.url=jdbc:h2:mem:ogmdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
##########################################
## HIBERNATE OPTIMIZATION
##########################################
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.generate_statistics=false
##########################################
## OPENAI (ENV VAR ONLY)
##########################################
openai.api.key=${OPENAI_API_KEY}
